<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página não encontrada — Kelly Machado</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* 
         * 1. DESIGN TOKENS 
         * Overriding the original purple palette with the Kelly Machado pink/plum palette.
         */
        :root { 
            --bg-main: linear-gradient(135deg, #EDE4EA 0%, #E8DCE1 100%); /* Pinkish background */
            --window-bg: #FFFFFF;
            --ink: #3A2E36; 
            --ink-soft: #6B5F66; 
            --accent: #B08894; 
            --accent-dark: #8E6A78; 
            --accent-light: #E8DCE1;
            
            /* Colors for the top icons */
            --icon-red: #D98686;
            --icon-yellow: #E8B87C;
            --icon-blue: #B08894; /* Changed from blue to pink */
            --icon-circle: #8E6A78;
            --icon-green: #7FA890;

            /* Window top bar colors */
            --bar-bg: #F5EEF1;
            --bar-dots: #D1C1C7;
        }
        
        /* Dark mode support */
        :root.dark { 
            --bg-main: linear-gradient(135deg, #1A1620 0%, #2C2530 100%);
            --window-bg: #262029;
            --ink: #F0E6EC; 
            --ink-soft: #C4B2BC; 
            --accent: #C1A0AC; 
            --accent-dark: #C9A8B4; 
            --accent-light: #3A2E36;
            --bar-bg: #322B37;
            --bar-dots: #4A3E4D;
        }

        /* 
         * 2. BASE RESET & LAYOUT
         */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: var(--bg-main);
            font-family: 'Inter', system-ui, sans-serif; 
            position: relative;
            overflow: hidden;
        }

        /* 
         * 3. DECORATIVE BACKGROUND SHAPES 
         * (Recreating the big circle and triangle from the reference image, but in pink)
         */
        .bg-shape-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: var(--accent-light);
            top: -100px;
            left: -150px;
            opacity: 0.6;
            z-index: 0;
        }

        .bg-shape-triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 300px solid transparent;
            border-right: 300px solid transparent;
            border-bottom: 400px solid var(--accent-light);
            bottom: -150px;
            right: -150px;
            transform: rotate(15deg);
            opacity: 0.6;
            z-index: 0;
        }

        /* 
         * 4. THE BROWSER WINDOW FRAME
         */
        .browser-window { 
            position: relative;
            z-index: 10;
            width: 100%; 
            max-width: 600px; 
            background-color: var(--window-bg); 
            border-radius: 12px; 
            box-shadow: 0 30px 60px -15px rgba(74, 63, 75, 0.4); 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* The top bar with the fake Mac window dots */
        .window-bar {
            background-color: var(--bar-bg);
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .window-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--bar-dots);
        }

        .dot-404 {
            margin-left: 20px;
            font-size: 10px;
            font-weight: 600;
            color: var(--ink-soft);
            opacity: 0.7;
        }

        /* 
         * 5. MAIN CONTENT INSIDE THE WINDOW
         */
        .content {
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The colored geometric icons */
        .icon-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .icon { width: 14px; height: 14px; position: relative; }
        
        /* Cross (X) */
        .icon-cross::before, .icon-cross::after { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--icon-red); }
        .icon-cross::before { transform: rotate(45deg); }
        .icon-cross::after { transform: rotate(-45deg); }
        
        /* Zigzag */
        .icon-zigzag { border-left: 3px solid var(--icon-yellow); border-bottom: 3px solid var(--icon-yellow); width: 10px; height: 10px; transform: translateY(-3px) rotate(-45deg); }
        
        /* Triangle */
        .icon-triangle { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid var(--icon-blue); }
        
        /* Circle */
        .icon-circle { border: 2px solid var(--icon-circle); border-radius: 50%; width: 12px; height: 12px; }
        
        /* Pause */
        .icon-pause::before, .icon-pause::after { content: ''; position: absolute; top: 0; width: 3px; height: 100%; background: var(--icon-green); }
        .icon-pause::before { left: 3px; }
        .icon-pause::after { right: 3px; }

        /* Subtitle */
        .subtitle {
            font-size: 22px;
            color: var(--accent-dark);
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        /* 
         * 6. THE GLITCH EFFECT ON 404
         * We use three layers. The base 404, and two pseudo-elements that are slightly offset,
         * blurred, and made semi-transparent to create the "speed/glitch" look from the image.
         */
        .glitch-container {
            position: relative;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        /* Background horizontal lines behind the 404 (like the reference) */
        .glitch-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 60px;
            transform: translateY(-50%);
            background-image: linear-gradient(90deg, 
                transparent 0%, var(--accent-light) 10%, transparent 20%, 
                var(--accent-light) 40%, transparent 50%, var(--accent-light) 80%, transparent 100%);
            background-size: 100% 100%;
            opacity: 0.5;
            z-index: 0;
        }

        .glitch-text {
            font-size: 130px;
            font-weight: 800;
            color: var(--accent);
            position: relative;
            z-index: 2;
            letter-spacing: -5px;
            line-height: 1;
        }

        /* Offset layer 1 */
        .glitch-text::before {
            content: '404';
            position: absolute;
            top: 0; left: 0;
            color: var(--accent-dark);
            transform: translateX(-20px);
            opacity: 0.4;
            filter: blur(2px);
            z-index: -1;
        }

        /* Offset layer 2 */
        .glitch-text::after {
            content: '404';
            position: absolute;
            top: 0; left: 0;
            color: var(--accent);
            transform: translateX(20px);
            opacity: 0.3;
            filter: blur(5px);
            z-index: -1;
        }

        /* 
         * 7. TEXT AND BUTTON
         */
        .message {
            font-size: 14px;
            color: var(--ink-soft);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .reasons {
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn-return {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 4px;
            background-color: var(--bar-bg);
            color: var(--ink-soft);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn-return:hover {
            background-color: var(--accent-light);
            color: var(--accent-dark);
        }

        /* Easter egg text */
        .easter-egg-text {
            display: block;
            margin-top: 15px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-dark);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .easter-egg-text.show { opacity: 1; }
    </style>

    <script>
        try {
            if (localStorage.getItem('tema-painel') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>
</head>
<body>

    <!-- Decorative background elements -->
    <div class="bg-shape-circle"></div>
    <div class="bg-shape-triangle"></div>

    <!-- Main semantic container simulating a browser window -->
    <main class="browser-window">
        
        <!-- Fake top bar with the Mac OS dots -->
        <header class="window-bar">
            <div class="window-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="dot-404">404</div>
        </header>

        <section class="content">
            <!-- The colored geometric icons -->
            <div class="icon-row">
                <div class="icon icon-cross"></div>
                <div class="icon icon-zigzag"></div>
                <div class="icon icon-triangle"></div>
                <div class="icon icon-circle"></div>
                <div class="icon icon-pause"></div>
            </div>

            <h1 class="subtitle">404 Not Found</h1>
            
            <!-- The glitchy 404 effect -->
            <div class="glitch-container" id="error-code" title="Clique 3 vezes...">
                <div class="glitch-text">404</div>
            </div>

            <p class="message">The page you're looking for can't be found.</p>
            <p class="reasons">
                Perhaps you are here because:<br>
                The page has moved<br>
                The page no longer exists<br>
                The page has deleted<br>
                You like 404 pages
            </p>
        </section>

        <footer class="content" style="padding-top: 0;">
            <a href="/" class="btn-return">Voltar ao painel</a>
            
            <span class="easter-egg-text" id="easter-egg-text">
                🦷 O sorriso que você procurava deve estar em outro dente!
            </span>
        </footer>
    </main>

    <script>
        // Easter Egg Logic
        const errorCode = document.getElementById('error-code');
        const easterEggText = document.getElementById('easter-egg-text');
        let clickCount = 0;

        errorCode.addEventListener('click', () => {
            clickCount++;

            if (clickCount === 3) {
                // Apply a temporary CSS filter to make the glitch go crazy
                const glitchText = document.querySelector('.glitch-text');
                glitchText.style.transition = 'all 0.5s';
                glitchText.style.transform = 'rotate(360deg) scale(1.2)';
                
                setTimeout(() => {
                    easterEggText.classList.add('show');
                }, 300);

                clickCount = 0; 
            }
        });
    </script>
</body>
</html>
